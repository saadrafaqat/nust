<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUST Computer Based Entry Test (CBNET)</title>
    <script src="questions.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #FFFFFF; user-select: none; }
        
        .login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #0055A5); background-size: 400% 400%; animation: gradientBG 15s ease infinite; padding: 20px; }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .login-container { width: 100%; max-width: 460px; background: rgba(255, 255, 255, 0.95); padding: 35px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .login-header { color: #003399; font-size: 22px; font-weight: 800; padding-bottom: 6px; text-align: center; }
        .nust-logo-sub { text-align: center; font-size: 13px; color: #FF0000; font-weight: 700; margin-bottom: 25px; text-transform: uppercase; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 12px; font-weight: 700; color: #444; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 12px; border: 2px solid #D5DBDB; border-radius: 8px; }
        .login-btn { width: 100%; padding: 14px; background: #0055A5; color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 10px; }
        
        .exam-interface { display: none; padding: 15px; }
        .test-table { width: 100%; border-collapse: collapse; border: 3px double #0055A5; }
        .workspace-container { display: flex; min-height: 360px; border-bottom: 2px solid #0055A5; }
        .left-main-canvas { flex: 1; border-right: 2px solid #0055A5; }
        .question-body-pane { padding: 20px; font-size: 15px; font-weight: bold; min-height: 110px; }
        .option-row-item { padding: 10px 15px; border: 1px solid #A9CCE3; cursor: pointer; }
        .option-row-item.selected { background: #D4E6F1; border: 1px solid #0055A5; }
        
        .navigation-grid-wrapper { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; padding: 10px; }
        .nav-square-btn { background: #E5E7E9; padding: 5px; text-align: center; cursor: pointer; font-size: 12px; }
        .nav-square-btn.active-focus { border: 2px solid #FF0000; }
        .nav-square-btn.filled { background: #2ECC71; }
        
        .modal-screen { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 9999; }
        .modal-body { background: white; padding: 30px; max-width: 600px; width: 90%; }
    </style>
</head>
<body>

    <div class="login-screen" id="loginScreenView">
        <div class="login-container">
            <div class="login-header">NUST Entry Test Portal</div>
            <div class="form-group">
                <label>Roll Number</label>
                <input type="text" id="candidateIdInput">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="candidatePassInput">
            </div>
            <button class="login-btn" onclick="authenticateUserLogin()">Login</button>
        </div>
    </div>

    <div class="login-screen" id="fieldSelectionView" style="display:none;">
        <div class="login-container">
            <div class="login-header">Select Your Stream</div>
            <button class="login-btn" onclick="setStream('engineering')">Engineering</button>
            <button class="login-btn" onclick="setStream('applied_sciences')">Applied Sciences</button>
            <button class="login-btn" onclick="setStream('business_studies')">Business Studies</button>
        </div>
    </div>

    <div class="exam-interface" id="examPortalView">
        <div class="test-table">
            <div id="currentSubjectHeader" style="background:#0055A5; color:white; padding:10px;">SUBJECT</div>
            <div class="workspace-container">
                <div class="left-main-canvas">
                    <div class="question-body-pane" id="questionTextBox">Loading...</div>
                    <div id="optionsRadioGroup"></div>
                </div>
            </div>
        </div>
        <div class="navigation-grid-wrapper" id="navButtonMatrixGrid"></div>
        <button onclick="saveAnswerState()">Save & Next</button>
    </div>

    <div class="modal-screen" id="reportCardModalOverlay">
        <div class="modal-body">
            <h2>Result Summary</h2>
            <div id="totalScoreTarget"></div>
            <button onclick="location.reload()">Restart</button>
        </div>
    </div>

    <script>
        let selectedField = '';
        let activeTestSessionPool = [];
        let globalPointerIndex = 0;

        // Blueprint logic
        const BLUEPRINTS = {
            engineering: { mathematics: 100, physics: 60, english: 40 },
            applied_sciences: { biology: 100, chemistry: 60, english: 40 },
            business_studies: { quantitative_mathematics: 100, english: 100 }
        };

        function authenticateUserLogin() {
            if(document.getElementById('candidatePassInput').value === "NUST2026") {
                document.getElementById('loginScreenView').style.display = 'none';
                document.getElementById('fieldSelectionView').style.display = 'flex';
            } else { alert("Invalid Password"); }
        }

        function setStream(field) {
            selectedField = field;
            document.getElementById('fieldSelectionView').style.display = 'none';
            document.getElementById('examPortalView').style.display = 'block';
            launchTestEngine();
        }

        function launchTestEngine() {
            const blueprint = BLUEPRINTS[selectedField];
            const source = QUESTION_BANK[selectedField];

            Object.keys(blueprint).forEach(sec => {
                let pool = [...source[sec]].sort(() => 0.5 - Math.random()).slice(0, blueprint[sec]);
                pool.forEach(item => { item.sectionKeyName = sec; item.chosenIndexValue = null; });
                activeTestSessionPool = activeTestSessionPool.concat(pool);
            });
            refreshWorkspaceUI();
        }

        function refreshWorkspaceUI() {
            const q = activeTestSessionPool[globalPointerIndex];
            document.getElementById('currentSubjectHeader').innerText = q.sectionKeyName.toUpperCase();
            document.getElementById('questionTextBox').innerText = q.q;
            
            const container = document.getElementById('optionsRadioGroup');
            container.innerHTML = '';
            q.a.forEach((opt, idx) => {
                let div = document.createElement('div');
                div.className = `option-row-item ${q.chosenIndexValue === idx ? 'selected' : ''}`;
                div.innerHTML = opt;
                div.onclick = () => { q.chosenIndexValue = idx; refreshWorkspaceUI(); };
                container.appendChild(div);
            });
            generateNavigationMatrix();
        }

        function generateNavigationMatrix() {
            const grid = document.getElementById('navButtonMatrixGrid');
            grid.innerHTML = '';
            activeTestSessionPool.forEach((_, idx) => {
                let btn = document.createElement('div');
                btn.className = 'nav-square-btn ' + (idx === globalPointerIndex ? 'active-focus' : '');
                btn.innerText = idx + 1;
                btn.onclick = () => { globalPointerIndex = idx; refreshWorkspaceUI(); };
                grid.appendChild(btn);
            });
        }

        function saveAnswerState() {
            if(globalPointerIndex < activeTestSessionPool.length - 1) {
                globalPointerIndex++;
                refreshWorkspaceUI();
            } else {
                compileExamResults();
            }
        }

        function compileExamResults() {
            let score = activeTestSessionPool.filter(i => i.chosenIndexValue === i.c).length;
            document.getElementById('totalScoreTarget').innerText = "Score: " + score;
            document.getElementById('reportCardModalOverlay').style.display = 'flex';
        }
    </script>
</body>
</html>
