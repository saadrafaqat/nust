<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NUST Computer Based Entry Test (CBNET)</title>
    <script src="questions.js"></script>
    <style>
        /* [KEEP YOUR ORIGINAL CSS HERE - I have omitted it for length, but keep everything from your original file] */
        .page-view { display: none; }
        .login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(-45deg, #0f2027, #0055A5); }
        .login-container { background: white; padding: 35px; border-radius: 16px; width: 460px; }
        .login-btn { width: 100%; padding: 14px; background: #0055A5; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="login-screen" id="loginScreenView">
        <div class="login-container">
            <div class="login-header">National University of Sciences & Technology</div>
            <div class="form-group"><input type="text" id="candidateIdInput" placeholder="Roll Number"></div>
            <div class="form-group"><input type="password" id="candidatePassInput" placeholder="Password"></div>
            <button class="login-btn" onclick="authenticateUserLogin()">Login</button>
        </div>
    </div>

    <div class="login-screen page-view" id="fieldSelectionView">
        <div class="login-container">
            <h2 style="text-align:center;">Select Your Stream</h2>
            <button class="login-btn" onclick="initField('engineering')">Engineering</button>
            <button class="login-btn" onclick="initField('business')">Business</button>
            <button class="login-btn" onclick="initField('applied_sciences')">Applied Sciences</button>
            <button class="login-btn" onclick="initField('architecture')">Architecture</button>
            <button class="login-btn" onclick="initField('natural_sciences')">Natural Sciences</button>
        </div>
    </div>

    <div class="exam-interface page-view" id="examPortalView">
        </div>

    <script>
        // --- ADD THESE VARIABLES ---
        let selectedField = '';

        // --- UPDATE LOGIN LOGIC ---
        function authenticateUserLogin() {
            const rawPass = document.getElementById('candidatePassInput').value.trim();
            if(rawPass === "NUST2026") {
                document.getElementById('loginScreenView').style.display = 'none';
                document.getElementById('fieldSelectionView').style.display = 'flex';
            } else {
                alert("Invalid Password");
            }
        }

        // --- NEW INITIALIZER ---
        function initField(field) {
            selectedField = field;
            document.getElementById('fieldSelectionView').style.display = 'none';
            document.getElementById('examPortalView').style.display = 'block';
            
            // Re-run your original engine with the new selected field
            launchTestEngine(); 
        }

        // --- MODIFIED ENGINE ---
        function launchTestEngine() {
            activeTestSessionPool = [];
            // Access the nested structure in questions.js using the selected field
            const fieldData = QUESTION_BANK[selectedField]; 

            Object.keys(TARGET_BLUEPRINT).forEach(sec => {
                if (fieldData[sec]) {
                    const localizedSubSet = pullRandomPool(fieldData[sec], TARGET_BLUEPRINT[sec]);
                    localizedSubSet.forEach((item, index) => {
                        item.innerIndexValue = index + 1;
                        item.sectionKeyName = sec;
                    });
                    activeTestSessionPool = activeTestSessionPool.concat(localizedSubSet);
                }
            });
            
            // Now trigger your original helper functions
            updateTimerDisplayElement();
            executeCountdownTimer();
            refreshWorkspaceUI();
            generateNavigationMatrix();
        }

        // [KEEP ALL YOUR OTHER ORIGINAL FUNCTIONS BELOW THIS POINT]
    </script>
</body>
</html>
