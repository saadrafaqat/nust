<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body { font-family: Arial, sans-serif; background: #fff; margin: 0; }
        /* Header */
        .header { background: #003399; color: white; padding: 10px; font-weight: bold; }
        /* Question Layout */
        .q-container { border: 2px solid #003399; margin: 20px; padding: 20px; }
        .option-box { border: 1px solid #000; padding: 10px; margin: 5px 0; cursor: pointer; }
        .option-box:hover { background: #f0f0f0; }
        /* Navigation */
        .nav-bar { border: 1px solid #003399; padding: 10px; margin: 20px; display: flex; gap: 10px; }
    </style>
</head>
<body>

    <!-- 1. LOGIN / SELECT -->
    <div id="setupView">
        <h2>Login</h2>
        <input type="text" id="roll" placeholder="Roll No"><br>
        <button onclick="document.getElementById('setupView').style.display='none'; document.getElementById('testView').style.display='block';">Login</button>
    </div>

    <!-- 2. TEST INTERFACE (NUST STYLE) -->
    <div id="testView" style="display:none;">
        <div class="header">NUST Computer Based Entry Test</div>
        <div class="q-container">
            <h3 id="qNum">Question 1</h3>
            <p id="qText">Loading question...</p>
            <div id="options"></div>
        </div>
        <div class="nav-bar">
            <button onclick="prev()">Prev</button>
            <button onclick="next()">Next</button>
            <span>Time: 79 min</span>
        </div>
    </div>

    <script src="questions.js"></script>
    <script>
        let currentIdx = 0;
        // Adjust this to match your questions.js structure
        let questions = window.QUESTION_BANK ? Object.values(QUESTION_BANK.engineering).flat() : [];

        function render() {
            if(questions.length === 0) return;
            const q = questions[currentIdx];
            document.getElementById('qNum').innerText = "Question " + (currentIdx + 1);
            document.getElementById('qText').innerText = q.q;
            document.getElementById('options').innerHTML = q.a.map(opt => `<div class="option-box">${opt}</div>`).join('');
        }

        function next() { if(currentIdx < questions.length - 1) { currentIdx++; render(); } }
        function prev() { if(currentIdx > 0) { currentIdx--; render(); } }

        render();
    </script>
</body>
</html>
