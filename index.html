<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUST Computer Based Entry Test (CBNET)</title>
    <style>
        :root { --nust-blue: #0055A5; --nust-dark: #003399; --accent: #FFD700; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        
        /* Background Animation */
        body { 
            background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #0055A5); 
            background-size: 400% 400%; animation: gradientBG 15s ease infinite; 
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        /* Glassmorphism Containers */
        .card { 
            background: rgba(255, 255, 255, 0.95); padding: 40px; border-radius: 20px; 
            width: 100%; max-width: 450px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); 
            text-align: center; backdrop-filter: blur(10px); display: none;
        }
        .active { display: block; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; } }

        h2 { color: var(--nust-dark); font-size: 24px; margin-bottom: 10px; }
        .sub { color: #FF0000; font-weight: 800; font-size: 12px; text-transform: uppercase; margin-bottom: 30px; letter-spacing: 1px; }

        input { width: 100%; padding: 15px; margin-bottom: 20px; border: 2px solid #eee; border-radius: 12px; font-size: 16px; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--nust-blue); box-shadow: 0 0 10px rgba(0,85,165,0.2); }

        .pass-wrapper { position: relative; display: flex; align-items: center; }
        .toggle-btn { position: absolute; right: 15px; cursor: pointer; font-size: 11px; font-weight: 700; color: #888; background: #eee; padding: 5px 10px; border-radius: 5px; }

        button { width: 100%; padding: 15px; background: var(--nust-blue); color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 16px; margin-top: 10px; transition: 0.3s; }
        button:hover { background: var(--nust-dark); transform: scale(1.02); }

        .field-grid { display: grid; gap: 15px; margin-top: 20px; }
    </style>
</head>
<body>

    <div id="loginView" class="card active">
        <h2>National University of Sciences & Technology</h2>
        <div class="sub">Computer Based Entry Test Portal (CBNET)</div>
        <input type="text" id="roll" placeholder="Candidate Roll Number">
        <div class="pass-wrapper">
            <input type="password" id="pass" placeholder="Access Password">
            <span class="toggle-btn" onclick="togglePass()">SHOW</span>
        </div>
        <button onclick="checkLogin()">Login & Select Field</button>
    </div>

    <div id="trackView" class="card">
        <h2>Select Academic Stream</h2>
        <div class="sub">Please choose your testing category</div>
        <div class="field-grid">
            <button onclick="startTest('engineering')">Engineering</button>
            <button onclick="startTest('applied')">Applied Sciences</button>
            <button onclick="startTest('business')">Business Studies</button>
            <button onclick="startTest('architecture')">Architecture</button>
            <button onclick="startTest('natural')">Natural Sciences</button>
        </div>
    </div>

    <script>
        function togglePass() {
            let p = document.getElementById('pass');
            let b = document.querySelector('.toggle-btn');
            if(p.type === "password") { p.type = "text"; b.innerText = "HIDE"; }
            else { p.type = "password"; b.innerText = "SHOW"; }
        }

        function checkLogin() {
            // Add simple auth check here
            if(document.getElementById('pass').value) {
                document.getElementById('loginView').classList.remove('active');
                document.getElementById('trackView').classList.add('active');
            } else { alert("Please enter password"); }
        }

        function startTest(track) {
            console.log("Selected Track:", track);
            alert("Redirecting to " + track + " assessment...");
            // Now you can easily add the call to your existing exam logic
        }
    </script>
</body>
</html>
