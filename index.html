<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUST Computer Based Entry Test (CBNET)</title>
    <script src="questions.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #FFFFFF; user-select: none; }
        
        /* Shared Screen Styles */
        .page-view { display: none; min-height: 100vh; }
        #loginScreenView { display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #0055A5); background-size: 400% 400%; animation: gradientBG 15s ease infinite; padding: 20px; }
        
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        
        .container { width: 100%; max-width: 460px; background: rgba(255, 255, 255, 0.95); padding: 35px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .login-header { color: #003399; font-size: 22px; font-weight: 800; text-align: center; margin-bottom: 25px; }
        
        /* Field Selection Styles */
        .field-btn { width: 100%; padding: 12px; margin-bottom: 10px; background: #0055A5; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .field-btn:hover { background: #003399; }

        /* [KEEPING YOUR ORIGINAL STYLES BELOW] */
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 12px; font-weight: 700; color: #444; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 12px; border: 2px solid #D5DBDB; border-radius: 8px; }
        .login-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #0055A5, #003399); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        
        /* Retro Interface - UNCHANGED AS REQUESTED */
        .exam-interface { display: none; padding: 15px; }
        .test-table { width: 100%; border-collapse: collapse; border: 3px double #0055A5; }
        .top-header-row { background: #FFFFFF; border-bottom: 2px solid #0055A5; color: #008000; font-weight: bold; padding: 6px 10px; }
        .stream-title { text-align: center; color: #FF0000; font-weight: bold; font-size: 13px; border-bottom: 2px solid #0055A5; padding: 5px; }
        .workspace-container { display: flex; border-bottom: 2px solid #0055A5; min-height: 360px; }
        .left-main-canvas { flex: 1; border-right: 2px solid #0055A5; }
        .question-body-pane { padding: 20px; font-size: 15px; font-weight: bold; border-bottom: 2px solid #0055A5; }
        .options-list-wrapper { padding: 15px; }
        .option-row-item { display: flex; align-items: center; border: 1px solid #A9CCE3; padding: 10px; margin-bottom: 5px; cursor: pointer; }
        .option-row-item.selected { background: #D4E6F1; border: 1px solid #0055A5; }
        .navigation-grid-wrapper { border: 1px solid #0055A5; margin: 10px 0; padding: 8px; display: grid; grid-template-columns: repeat(20, 1fr); gap: 4px; }
        .nav-square-btn { border: 1px solid #7F8C8D; text-align: center; font-size: 11px; padding: 5px 0; cursor: pointer; }
        .nav-square-btn.active-focus { border: 2px solid #FF0000; color: #FF0000; }
        .bottom-action-row { display: flex; justify-content: space-between; align-items: center; }
        .button-bar-right { display: flex; gap: 4px; }
        .retro-control-btn { padding: 6px 12px; font-size: 12px; font-weight: bold; color: white; cursor: pointer; border-radius: 3px; }
        .modal-screen { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; }
        .modal-body { background: white; border: 3px double #0055A5; padding: 25px; width: 650px; }
    </style>
</head>
<body>

    <div id="loginScreenView" class="page-view" style="display: flex;">
        <div class="container">
            <div class="login-header">NUST Login</div>
            <div class="form-group"><input type="text" id="candidateIdInput" placeholder="Candidate ID"></div>
            <div class="form-group"><input type="password" id="candidatePassInput" placeholder="Password"></div>
            <button class="login-btn" onclick="authenticateUserLogin()">Login</button>
        </div>
    </div>

    <div id="fieldSelectionView" class="page-view" style="display: none; align-items: center; justify-content: center; height: 100vh;">
        <div class="container">
            <h2 style="text-align: center; margin-bottom: 20px; color: #003399;">Select Field</h2>
            <button class="field-btn" onclick="selectField('engineering')">Engineering</button>
            <button class="field-btn" onclick="selectField('business')">Business Studies</button>
            <button class="field-btn" onclick="selectField('applied')">Applied Sciences</button>
            <button class="field-btn" onclick="selectField('architecture')">Architecture</button>
            <button class="field-btn" onclick="selectField('natural')">Natural Sciences</button>
        </div>
    </div>

    <div id="examPortalView" class="page-view">
        <div class="test-table">
            <div class="top-header-row" id="currentSubjectHeader"></div>
            <div class="stream-title" id="streamTitleBanner"></div>
            <div class="workspace-container">
                <div class="left-main-canvas">
                    <div class="question-body-pane" id="questionTextBox"></div>
                    <div class="options-list-wrapper" id="optionsRadioGroup"></div>
                </div>
                <div style="width: 170px; padding: 10px;">ID: <span id="displayCandidateId"></span></div>
            </div>
        </div>
        <div class="navigation-grid-wrapper" id="navButtonMatrixGrid"></div>
        <div class="bottom-action-row">
            <div id="timerClockMinutes">03:00:00</div>
            <div class="button-bar-right" id="subjectControlButtons"></div>
        </div>
    </div>

    <script>
        const FIELD_CONFIG = {
            engineering: { math: 100, physics: 60, english: 40 },
            business: { math: 100, english: 100 },
            applied: { biology: 100, chemistry: 60, english: 40 },
            architecture: { design: 100, math: 60, english: 40 },
            natural: { math: 100, english: 100 }
        };

        let selectedField = '';
        let activeTestSessionPool = [];
        let globalPointerIndex = 0;

        function authenticateUserLogin() {
            document.getElementById('loginScreenView').style.display = 'none';
            document.getElementById('fieldSelectionView').style.display = 'flex';
        }

        function selectField(field) {
            selectedField = field;
            document.getElementById('fieldSelectionView').style.display = 'none';
            document.getElementById('examPortalView').style.display = 'block';
            initTest(FIELD_CONFIG[field]);
        }

        function initTest(blueprint) {
            // Logic to populate activeTestSessionPool based on blueprint
            // ... (your existing logic for pulling from QUESTION_BANK)
            renderSubjectButtons(blueprint);
            refreshWorkspaceUI();
        }

        function renderSubjectButtons(blueprint) {
            const container = document.getElementById('subjectControlButtons');
            container.innerHTML = '';
            Object.keys(blueprint).forEach(sub => {
                const btn = document.createElement('button');
                btn.className = 'retro-control-btn';
                btn.style.background = '#34495E';
                btn.innerText = sub.toUpperCase();
                btn.onclick = () => switchSubjectCluster(sub);
                container.appendChild(btn);
            });
        }

        // Add remaining functions (refreshWorkspaceUI, saveAnswerState, etc.) here...
    </script>
</body>
</html>
